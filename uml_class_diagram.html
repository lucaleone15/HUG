<style>
#uml svg.classDiagram .divider path { stroke-opacity: 0.5; }
#uml svg.classDiagram .row-rect-odd path,
#uml svg.classDiagram .row-rect-odd rect,
#uml svg.classDiagram .row-rect-even path,
#uml svg.classDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="uml"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('uml-svg', `classDiagram
  direction TB

  class Company {
    +UUID id
    +String name
    +String slug
    +String logoUrl
    +String primaryColor
    +String secondaryColor
    +Integer employeeCount
    +Boolean isActive
    +DateTime createdAt
    +DateTime updatedAt
    +getRouteKeyName() String
    +participationRate() Float
    +eligibleSubmissionsCount() Integer
  }

  class User {
    +UUID id
    +String name
    +String email
    +String password
    +Date birthDate
    +BloodType bloodType
    +Boolean isAdmin
    +DateTime emailVerifiedAt
    +DateTime createdAt
    +DateTime updatedAt
    +createTokens() String
    +isEligible() Boolean
  }

  class Quiz {
    +UUID id
    +String title
    +String description
    +Boolean isActive
    +DateTime createdAt
    +DateTime updatedAt
    +evaluateEligibility(answers) Boolean
  }

  class Question {
    +UUID id
    +String content
    +QuestionType type
    +Integer displayOrder
    +Boolean isRequired
    +DateTime createdAt
    +DateTime updatedAt
  }

  class QuestionOption {
    +UUID id
    +String label
    +Boolean isDisqualifying
    +Integer displayOrder
    +DateTime createdAt
    +DateTime updatedAt
  }

  class Submission {
    +UUID id
    +String sessionToken
    +Boolean isEligible
    +DateTime completedAt
    +DateTime createdAt
    +DateTime updatedAt
    +attachToUser(user) void
    +calculateEligibility() Boolean
  }

  class SubmissionAnswer {
    +UUID id
    +String textValue
    +DateTime createdAt
    +DateTime updatedAt
  }

  class BloodType {
    <<enumeration>>
    A_POSITIVE
    A_NEGATIVE
    B_POSITIVE
    B_NEGATIVE
    AB_POSITIVE
    AB_NEGATIVE
    O_POSITIVE
    O_NEGATIVE
  }

  class QuestionType {
    <<enumeration>>
    YES_NO
    MULTIPLE_CHOICE
    MULTIPLE_SELECT
    TEXT
  }

  Company "1" --> "0..*" User : employs
  Company "0..1" --> "1" Quiz : uses
  Company "1" --> "0..*" Submission : receives
  User "0..1" --> "0..*" Submission : submits
  Quiz "1" --> "1..*" Question : contains
  Question "1" --> "0..*" QuestionOption : proposes
  Submission "1" --> "1..*" SubmissionAnswer : composes
  Question "1" --> "0..*" SubmissionAnswer : receives
  QuestionOption "0..1" --> "0..*" SubmissionAnswer : selected
  Quiz "1" --> "0..*" Submission : passed_for

  User ..> BloodType : uses
  Question ..> QuestionType : uses`);
document.getElementById('uml').innerHTML = svg;

document.querySelectorAll('#uml svg.classDiagram .classGroup').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
</script>
